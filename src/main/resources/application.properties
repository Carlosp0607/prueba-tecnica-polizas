# Configuracion de la aplicacion. Spring lee este archivo al arrancar.

# Nombre de la aplicacion (aparece en los logs)
spring.application.name=polizas

# Base de datos H2 en memoria llamada "polizasdb". Se crea al arrancar y se borra al apagar.
spring.datasource.url=jdbc:h2:mem:polizasdb

# Hibernate crea las tablas a partir de las entidades (Poliza, Riesgo) al arrancar
# y las borra al apagar. Solo apto para desarrollo y pruebas.
spring.jpa.hibernate.ddl-auto=create-drop

# Ejecuta data.sql DESPUES de que Hibernate cree las tablas (si no, el INSERT falla)
spring.jpa.defer-datasource-initialization=true

# Cierra la conexion a BD al terminar la logica del servicio, no al terminar de armar la respuesta HTTP.
# Es buena practica: evita consultas ocultas desde el controlador.
spring.jpa.open-in-view=false

# Llave que debe venir en el header x-api-key de cada peticion
api.key=123456

# Direccion del CORE. Aqui apunta al mock que vive en esta misma app.
# En produccion se cambiaria por la URL real de la capa media WebLogic.
core.url=http://localhost:${server.port:8080}

# Porcentaje de IPC que se aplica al renovar. Configurable sin tocar codigo.
polizas.ipc=5.20
